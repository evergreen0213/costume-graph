name: 복식 서지 최신화

on:
  schedule:
    # 『복식』은 격월간이고 발행일이 짝수달 말일로 정해져 있지만, 실제로는 다음 달까지
    # 밀리기도 한다. 그래서 나오는 호를 쫓아가지 않는다. 다음 발행월 1일에 가서
    # **지난 호를 줍는다.** 한 달 남짓 여유를 두는 셈이라 늦어져도 놓치지 않는다.
    #   짝수달 1일 09:00 KST — 4/1, 6/1, 8/1 … 이것이 본 일정이다.
    - cron: '0 0 1 2,4,6,8,10,12 *'
    # 홀수달 1일 — 안전선. 깃허브는 저장소가 60일간 조용하면 예약 실행을 꺼버리는데,
    # 짝수달만 돌면 사이가 59~62일이라 대부분 걸린다. 그래서 사이에 한 번 더 깨운다.
    # 그날은 대개 새 논문이 없어 그대로 끝나므로 부담은 없다.
    - cron: '0 0 1 1,3,5,7,9,11 *'
  workflow_dispatch:          # Actions 탭에서 손으로도 돌릴 수 있게
  push:
    branches: [main]
    paths:                    # 파이프라인이 바뀌면 바로 다시 빌드
      - 'build/**'
      - '한국복식학회/excel/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write             # 갱신된 데이터를 다시 커밋
  pages: write                # Pages 배포
  id-token: write

concurrency:
  group: costume-graph
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # 고정. 바꾸면 부동소수점 말단이 달라져 지도가 바뀐다
          cache: pip

      - uses: actions/setup-node@v4   # 연기 시험(build/smoke.js)용
        with:
          node-version: '20'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 자기 갱신 주소 정하기
        id: pages
        run: |
          # 페이지가 새 자료를 받아 갈 주소. 저장소 변수 PAGES_URL 이 있으면 그걸 쓰고,
          # 없으면 이 저장소의 기본 Pages 주소를 짓는다.
          #   <계정>.github.io 라는 이름의 저장소만 루트에 붙고, 나머지는 /<저장소>/ 아래다.
          if [ -n "${{ vars.PAGES_URL }}" ]; then
            url='${{ vars.PAGES_URL }}'
          elif [ '${{ github.event.repository.name }}' = '${{ github.repository_owner }}.github.io' ]; then
            url='https://${{ github.repository_owner }}.github.io'
          else
            url='https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}'
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "자기 갱신 주소: ${url%/}"

      - name: 파이프라인 실행
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}   # render.py 가 페이지에 박아 넣는다
        run: bash build/update.sh      # DESIGN 미지정 = 1안만. 배포는 한 안만 나간다

      - name: 산출물 점검
        run: |
          # 내용 검증은 연기 시험이 이미 한다 (논문/키워드/갈래 수까지 확인).
          # 여기서는 페이지 변수명 같은 것에 묶이지 않는 것만 본다.
          test -s costume-graph.html
          ! grep -q '__DATA__' costume-graph.html || { echo '자리표시자가 치환되지 않았다'; exit 1; }
          n=$(wc -c < costume-graph.html)
          [ "$n" -gt 300000 ] || { echo "산출물이 ${n} 바이트뿐 — 데이터 유실 의심"; exit 1; }
          echo "costume-graph.html ${n} 바이트"
          # 자기 갱신에 필요한 두 파일과, 주소가 실제로 박혔는지
          test -s costume-graph.data.json
          test -s costume-graph.version.json
          grep -q "UPDATE_FROM = 'https://" costume-graph.html \
            || { echo '자기 갱신 주소가 비어 있다 — 넘긴 파일이 스스로 최신화하지 못한다'; exit 1; }
          python3 -c "import json; v=json.load(open('costume-graph.version.json')); d=json.load(open('costume-graph.data.json')); assert v['build'] and v['build']==d['build'], '판 번호가 어긋난다'; print('판', v['build'], v['builtAt'])"

      - name: 갱신분 커밋
        run: |
          git config user.name  'costume-graph bot'
          git config user.email 'actions@github.com'
          git add build/extra.json build/papers.json build/glyphs.json build/view-*.json costume-graph*.html
          if git diff --cached --quiet; then
            echo '변경 없음 — 커밋 건너뜀'
          else
            n=$(python3 -c "import json;print(len(json.load(open('build/papers.json',encoding='utf-8'))['papers']))")
            git commit -m "데이터 최신화: 논문 ${n}편"
            # GITHUB_TOKEN 으로 민 커밋은 워크플로를 다시 깨우지 않는다(깃허브 기본 동작).
            # 위 push 트리거와 무한 루프를 이루지 않는 이유.
            git push
          fi

      - name: 배포용 디렉터리 구성
        run: |
          mkdir -p site
          cp costume-graph.html         site/index.html
          cp costume-graph.html         site/costume-graph.html
          # 넘긴 파일이 매달 받아 갈 두 개. 이름이 바뀌면 그 파일들도 못 찾는다.
          cp costume-graph.data.json    site/costume-graph.data.json
          cp costume-graph.version.json site/costume-graph.version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
