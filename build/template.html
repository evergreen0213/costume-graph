<title>복식 연구 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 한지(밝음) / 먹(어두움) — 바탕은 두 상태 모두 명시적으로 칠한다 */
:root{
  --ground:#EDE6D8; --ground-2:#E3DAC7; --panel:#F6F1E7; --edge:#C7BCA4;
  --ink:#1F1A16; --ink-2:#59504A; --ink-3:#8A7F70;
  --n-paper:#2F4FA8;   /* 논문 — 남 */
  --n-kw:#AE3A73;      /* 키워드 — 자주 */
  --n-author:#3F7A22;  /* 연구자 — 녹 */
  --brand:#D81818;     /* 학회 진홍 — 데이터가 아닌 화면 요소 전용 */
  --hot:#1F1A16;       /* 선택 — 먹. 범주 3색과 색상이 겹치지 않는다 */
  --link:rgba(31,26,22,.15);
  --link-hot:rgba(31,26,22,.42);
  --field:rgba(31,26,22,.11);
  --shadow:0 1px 2px rgba(31,26,22,.10),0 10px 30px rgba(31,26,22,.11);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#141110; --ground-2:#1D1917; --panel:#1F1B18; --edge:#362E27;
    --ink:#EFE7D8; --ink-2:#A79C8B; --ink-3:#6F6558;
    --n-paper:#6B85DE; --n-kw:#CE6296; --n-author:#5FA33C;
    --brand:#E8564E; --hot:#EFE7D8;
    --link:rgba(239,231,216,.13); --link-hot:rgba(239,231,216,.40);
    --field:rgba(239,231,216,.10);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#141110; --ground-2:#1D1917; --panel:#1F1B18; --edge:#362E27;
  --ink:#EFE7D8; --ink-2:#A79C8B; --ink-3:#6F6558;
  --n-paper:#6B85DE; --n-kw:#CE6296; --n-author:#5FA33C;
  --brand:#E8564E; --hot:#EFE7D8;
  --link:rgba(239,231,216,.13); --link-hot:rgba(239,231,216,.40);
  --field:rgba(239,231,216,.10);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-weight:300; -webkit-font-smoothing:antialiased; overflow:hidden;
}
canvas{display:block; position:fixed; inset:0; width:100%; height:100%; cursor:grab}
canvas.grabbing{cursor:grabbing}
canvas.pointing{cursor:pointer}
:focus-visible{outline:2px solid var(--hot); outline-offset:2px}

.rail{
  position:fixed; top:0; left:0; bottom:0; width:300px; z-index:5;
  display:flex; flex-direction:column; gap:19px; padding:22px 22px 18px;
  background:linear-gradient(90deg,var(--ground) 76%,transparent);
  overflow-y:auto; overscroll-behavior:contain;
}
.masthead h1{font-family:"Gowun Batang",serif; font-weight:700; font-size:26px; margin:0 0 7px; letter-spacing:-.015em; line-height:1.25}
.masthead p{margin:0; font-size:12px; line-height:1.7; color:var(--ink-2)}
.rule{height:1px; background:var(--edge); margin:14px 0 12px}
.tally{display:flex; gap:15px; font-family:"IBM Plex Mono",monospace}
.tally div{display:flex; flex-direction:column; gap:2px}
.tally b{font-size:17px; font-weight:500; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.tally span{font-size:9.5px; letter-spacing:.09em; color:var(--ink-3); font-family:"IBM Plex Sans KR",sans-serif}

.field-label{font-size:10px; letter-spacing:.14em; color:var(--ink-3); margin-bottom:8px}
input[type=search]{
  width:100%; padding:9px 11px; font:inherit; font-size:13px; font-weight:400;
  color:var(--ink); background:var(--panel); border:1px solid var(--edge); border-radius:3px;
}
input[type=search]::placeholder{color:var(--ink-3); font-weight:300}

.legend{display:flex; flex-direction:column; gap:1px}
.legend button{display:flex; align-items:center; gap:10px; width:100%; padding:6px 8px; font:inherit; font-size:12.5px; color:var(--ink); text-align:left; background:none; border:0; border-radius:3px; cursor:pointer}
.legend button:hover{background:var(--ground-2)}
.legend button[aria-pressed=false]{color:var(--ink-3)}
.legend button[aria-pressed=false] .dot{opacity:.22}
.dot{width:9px; height:9px; border-radius:50%; flex:none}
.legend .num{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}

.fields{display:flex; flex-direction:column; gap:1px}
.fields button{
  display:flex; align-items:baseline; gap:8px; width:100%; padding:6px 8px;
  font:inherit; font-size:12.5px; color:var(--ink); text-align:left;
  background:none; border:0; border-left:2px solid transparent; border-radius:0 3px 3px 0; cursor:pointer;
}
.fields button:hover{background:var(--ground-2)}
.fields button[aria-pressed=true]{background:var(--ground-2); border-left-color:var(--hot); font-weight:500}
.fields .num{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}

.years{display:flex; flex-direction:column; gap:8px}
.years .row{display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; margin:0; accent-color:var(--hot)}

.foot{margin-top:auto; display:flex; flex-direction:column; gap:9px; padding-top:6px}
.foot p{margin:0; font-size:10.5px; line-height:1.65; color:var(--ink-3)}
.btns{display:flex; gap:6px}
.mini{font:inherit; font-size:11px; color:var(--ink-2); background:none; border:1px solid var(--edge); border-radius:3px; padding:5px 10px; cursor:pointer}
.mini:hover{color:var(--ink); border-color:var(--ink-3)}

.card{
  position:fixed; top:18px; right:18px; bottom:18px; width:356px; z-index:6;
  display:flex; flex-direction:column; background:var(--panel);
  border:1px solid var(--edge); border-radius:4px; box-shadow:var(--shadow);
  transform:translateX(calc(100% + 28px)); transition:transform .32s cubic-bezier(.22,1,.36,1);
}
.card.open{transform:none}
.card header{display:flex; align-items:center; gap:10px; padding:14px 15px; border-bottom:1px solid var(--edge)}
.card .kind{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.14em; padding:4px 7px; border-radius:2px; white-space:nowrap; color:#fff; background:var(--n-paper)}
.card .kind[data-t="1"]{background:var(--n-kw)} .card .kind[data-t="2"]{background:var(--n-author)}
.card .x{margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:20px; line-height:1; cursor:pointer; padding:0 3px}
.card .x:hover{color:var(--ink)}
.card .body{padding:16px 15px; overflow-y:auto; overscroll-behavior:contain}
.card h2{font-family:"Gowun Batang",serif; font-size:19px; font-weight:700; line-height:1.5; margin:0 0 13px}
dl{display:grid; grid-template-columns:58px 1fr; gap:7px 12px; margin:0 0 15px; font-size:12.5px; line-height:1.55}
dt{color:var(--ink-3); font-size:10.5px; letter-spacing:.05em; padding-top:2px}
dd{margin:0; font-weight:400}
dd.mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{font:inherit; font-size:11.5px; font-weight:400; color:var(--ink-2); cursor:pointer; background:var(--ground-2); border:1px solid transparent; border-radius:2px; padding:4px 8px}
.chip:hover{color:var(--ink); border-color:var(--edge)}
.sub{font-size:10px; letter-spacing:.13em; color:var(--ink-3); margin:0 0 9px}
.list{display:flex; flex-direction:column; gap:1px}
.list button{display:block; width:100%; text-align:left; font:inherit; font-size:12.5px; line-height:1.5; color:var(--ink); background:none; border:0; border-left:2px solid transparent; padding:7px 9px; cursor:pointer; border-radius:0 3px 3px 0}
.list button:hover{background:var(--ground-2); border-left-color:var(--hot)}
.list .yr{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3); margin-right:7px; font-variant-numeric:tabular-nums}

.tip{position:fixed; z-index:7; pointer-events:none; max-width:300px; padding:6px 9px; font-size:12px; line-height:1.45; color:var(--ink); background:var(--panel); border:1px solid var(--edge); border-radius:3px; box-shadow:var(--shadow); opacity:0; transition:opacity .12s}
.tip.on{opacity:1}


/* ── 한옥 대문 인트로 ── */
.gate{
  position:fixed; inset:0; z-index:20; background:var(--ground);
  display:flex; align-items:center; justify-content:center; padding:24px;
  transition:opacity .55s ease .45s, visibility 0s linear 1s;
}
.gate.open{opacity:0; visibility:hidden; pointer-events:none}
.gate-inner{display:flex; flex-direction:column; align-items:center; gap:0; max-width:560px; width:100%}
.gate img.mark{width:150px; height:auto; margin-bottom:20px}
.gate.open .gate-inner > *:not(.house){transition:opacity .3s ease; opacity:0}

.house{position:relative; width:min(430px,86vw); color:var(--ink); margin-bottom:26px}
.house .eave{display:block; width:114%; margin-left:-7%; color:var(--ink)}
.house .eave svg{display:block; width:100%; height:auto}
.frame{
  position:relative; margin:0 auto; width:78%; aspect-ratio:300/320;
  border:3px solid var(--ink); border-top:0; background:var(--ink);
  perspective:1400px; perspective-origin:50% 40%;
}
.leaf{
  position:absolute; top:0; bottom:0; width:50%; color:var(--ground);
  background:var(--ground); transition:transform 1.05s cubic-bezier(.62,.02,.2,1);
  backface-visibility:hidden;
}
.leaf svg{display:block; width:100%; height:100%; color:var(--ink)}
.leaf.l{left:0; transform-origin:left center; border-right:1.5px solid var(--ink)}
.leaf.r{right:0; transform-origin:right center; border-left:1.5px solid var(--ink)}
.gate.open .leaf.l{transform:rotateY(-108deg)}
.gate.open .leaf.r{transform:rotateY(108deg)}
/* 문고리 */
.ring{position:absolute; top:52%; width:17px; height:17px; border:2.5px solid var(--brand); border-radius:50%}
.leaf.l .ring{right:9px} .leaf.r .ring{left:9px}

.gate h1{font-family:"Gowun Batang",serif; font-size:31px; font-weight:700; margin:0 0 8px; letter-spacing:-.015em}
.gate .sub{margin:0 0 4px; font-size:13px; color:var(--ink-2); letter-spacing:.02em}
.gate .yrs{margin:0 0 22px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.24em; color:var(--brand)}
.enter{
  font:inherit; font-size:14px; font-weight:500; letter-spacing:.16em;
  color:var(--ground); background:var(--ink); border:0; border-radius:2px;
  padding:13px 40px; cursor:pointer; transition:background .18s, transform .18s;
}
.enter:hover{background:var(--brand); transform:translateY(-1px)}
.gate .hint{margin:14px 0 0; font-size:10.5px; color:var(--ink-3)}
@media (max-height:720px){
  .gate img.mark{width:104px; margin-bottom:12px}
  .house{width:min(320px,72vw); margin-bottom:16px}
  .gate h1{font-size:25px}
  .gate .yrs{margin-bottom:15px}
}
@media (prefers-reduced-motion:reduce){
  .gate{transition:opacity .2s}
  .leaf{transition:none}
  .gate.open .leaf.l,.gate.open .leaf.r{transform:none}
}

@media (max-width:880px){
  .rail{width:100%; height:auto; bottom:auto; background:linear-gradient(180deg,var(--ground) 82%,transparent); padding-bottom:26px; gap:13px}
  .masthead p,.years,.foot,.fields{display:none}
  .card{top:auto; left:12px; right:12px; bottom:12px; width:auto; height:58%; transform:translateY(calc(100% + 22px))}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>

<script>
const DATA = /*__DATA__*/;
const N=DATA.nodes, L=DATA.links, META=DATA.meta, NP=DATA.nPapers;
const COMM=DATA.comm, FIELDS=DATA.fields, NF=DATA.nFields;
const n=N.length, NG=NF+1;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

const X=new Float32Array(n), Y=new Float32Array(n), VX=new Float32Array(n), VY=new Float32Array(n);
const R=new Float32Array(n), T=new Uint8Array(n), W=new Float32Array(n);
const show=new Uint8Array(n).fill(1), fixed=new Uint8Array(n);
const adj=Array.from({length:n},()=>[]);

/* 갈래마다 지도 위 자리를 준다 — 색이 아니라 위치가 갈래를 나타낸다.
   자리는 cluster.py 가 갈래끼리의 연결 세기로 미리 계산해 둔 값이다. */
const AX=new Float32Array(NG), AY=new Float32Array(NG);
for(let g=0;g<NG;g++){ AX[g]=DATA.anchors[g][0]; AY[g]=DATA.anchors[g][1]; }

for(let i=0;i<n;i++){
  const d=N[i]; T[i]=d[0]; W[i]=d[3];
  R[i] = d[0]===0 ? 1.9+Math.min(Math.sqrt(d[3])*0.62,3.4)
       : d[0]===1 ? 2.6+Math.sqrt(d[3])*1.15
       :            2.4+Math.sqrt(d[3])*0.95;
  const g=COMM[i], a=i*2.399963, rr=40+((i*37)%160);
  X[i]=AX[g]+Math.cos(a)*rr; Y[i]=AY[g]+Math.sin(a)*rr;
}
for(const [s,t] of L){ adj[s].push(t); adj[t].push(s); }

/* ── 힘 시뮬레이션 (Barnes–Hut 쿼드트리) ── */
const THETA2=0.81, REPEL=-14, LINK_D=30, LINK_K=1.2, DECAY=0.86, GRAV=0.02, CLUST=0.10, MAXD=20;
let alpha=1, cooling=true;
const CELLS=8*n;
const qx=new Float32Array(CELLS), qy=new Float32Array(CELLS), qm=new Float32Array(CELLS);
const qc=new Int32Array(CELLS*4), qhead=new Int32Array(CELLS), leaf=new Uint8Array(CELLS);
const nextPt=new Int32Array(n);
let qCount=0, rootS=0;

function newCell(){
  if(qCount>=CELLS) return CELLS-1;
  const i=qCount++;
  qc[i*4]=qc[i*4+1]=qc[i*4+2]=qc[i*4+3]=-1;
  qhead[i]=-1; leaf[i]=1; qm[i]=0;
  return i;
}
function child(cell,quad){
  let c=qc[cell*4+quad];
  if(c===-1){ c=newCell(); qc[cell*4+quad]=c; }
  return c;
}
function insert(p){
  let cell=0, cx=0, cy=0, size=rootS, depth=0;
  for(;;){
    if(!leaf[cell]){
      const h=size/2, quad=(Y[p]>cy?2:0)+(X[p]>cx?1:0);
      cx+=(quad&1)? h/2:-h/2; cy+=(quad&2)? h/2:-h/2;
      size=h; depth++; cell=child(cell,quad); continue;
    }
    if(qhead[cell]===-1 || depth>=MAXD){ nextPt[p]=qhead[cell]; qhead[cell]=p; return; }
    leaf[cell]=0;                                   // 잎을 가지로 올리고 기존 점을 내린다
    let q=qhead[cell]; qhead[cell]=-1;
    while(q!==-1){
      const nx=nextPt[q], quad=(Y[q]>cy?2:0)+(X[q]>cx?1:0), c=child(cell,quad);
      nextPt[q]=qhead[c]; qhead[c]=q; q=nx;
    }
  }
}
function summarize(cell,cx,cy,size){                // 깊이가 MAXD로 묶여 재귀가 안전하다
  if(leaf[cell]){
    let m=0,sx=0,sy=0;
    for(let p=qhead[cell]; p!==-1; p=nextPt[p]){ m++; sx+=X[p]; sy+=Y[p]; }
    qm[cell]=m; if(m){ qx[cell]=sx/m; qy[cell]=sy/m; }
    return;
  }
  let m=0,sx=0,sy=0; const h=size/2;
  for(let k2=0;k2<4;k2++){
    const c=qc[cell*4+k2]; if(c===-1) continue;
    summarize(c, cx+((k2&1)?h/2:-h/2), cy+((k2&2)?h/2:-h/2), h);
    m+=qm[c]; sx+=qx[c]*qm[c]; sy+=qy[c]*qm[c];
  }
  qm[cell]=m; if(m){ qx[cell]=sx/m; qy[cell]=sy/m; }
}
const stC=new Int32Array(4*MAXD+8), stS=new Float32Array(4*MAXD+8);
function repel(i){
  let sp=0; stC[0]=0; stS[0]=rootS; sp=1;
  while(sp>0){
    sp--; const cell=stC[sp], size=stS[sp];
    if(qm[cell]===0) continue;
    if(leaf[cell]){
      for(let p=qhead[cell]; p!==-1; p=nextPt[p]){
        if(p===i) continue;
        let dx=X[p]-X[i], dy=Y[p]-Y[i], d2=dx*dx+dy*dy;
        if(d2<1){ dx=(i-p)%2?0.7:-0.7; dy=0.7; d2=1; }
        const f=REPEL*alpha/d2; VX[i]+=dx*f; VY[i]+=dy*f;
      }
      continue;
    }
    let dx=qx[cell]-X[i], dy=qy[cell]-Y[i], d2=dx*dx+dy*dy;
    if(d2<1) d2=1;
    if((size*size)/d2 < THETA2){
      const f=REPEL*qm[cell]*alpha/d2; VX[i]+=dx*f; VY[i]+=dy*f; continue;
    }
    if(sp+4>=stC.length) continue;
    for(let k2=0;k2<4;k2++){ const c=qc[cell*4+k2]; if(c!==-1){ stC[sp]=c; stS[sp]=size/2; sp++; } }
  }
}
function tick(){
  let ex=1;
  for(let i=0;i<n;i++){ const a=Math.abs(X[i]), b=Math.abs(Y[i]); if(a>ex)ex=a; if(b>ex)ex=b; }
  rootS=ex*2+80; qCount=0; newCell();
  for(let i=0;i<n;i++) insert(i);
  summarize(0,0,0,rootS);
  for(let i=0;i<n;i++) repel(i);

  for(let li=0; li<L.length; li++){
    const s=L[li][0], t=L[li][1];
    const dx=X[t]-X[s], dy=Y[t]-Y[s];
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-LINK_D)/d*alpha*LINK_K;
    const ws=1/(1+adj[s].length), wt=1/(1+adj[t].length), tot=ws+wt;
    VX[s]+=dx*f*(wt/tot)*2; VY[s]+=dy*f*(wt/tot)*2;
    VX[t]-=dx*f*(ws/tot)*2; VY[t]-=dy*f*(ws/tot)*2;
  }
  for(let i=0;i<n;i++){
    const g=COMM[i];
    VX[i]+=(AX[g]-X[i])*CLUST*alpha;                // 제 갈래 자리로 끌어당긴다
    VY[i]+=(AY[g]-Y[i])*CLUST*alpha;
    VX[i]-=X[i]*GRAV*alpha; VY[i]-=Y[i]*GRAV*alpha;
    if(fixed[i]){ VX[i]=VY[i]=0; continue; }
    VX[i]*=DECAY; VY[i]*=DECAY;
    const s2=VX[i]*VX[i]+VY[i]*VY[i];
    if(s2>900){ const sc=30/Math.sqrt(s2); VX[i]*=sc; VY[i]*=sc; }
    X[i]+=VX[i]; Y[i]+=VY[i];
  }
  if(cooling) alpha*=0.981;
  if(alpha<0.008){ alpha=0.008; cooling=false; }
}

/* ── 화면 ── */
let k=1, tx=0, ty=0, dpr=1, w=0, h=0, fitted=false;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  w=cv.clientWidth; h=cv.clientHeight;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
}
addEventListener('resize',resize); resize();
k=0.5; tx=w/2; ty=h/2;

const CSS=getComputedStyle(document.documentElement);
let COL={};
function readTheme(){
  const g=v=>CSS.getPropertyValue(v).trim();
  COL={ground:g('--ground'),paper:g('--n-paper'),kw:g('--n-kw'),au:g('--n-author'),
       hot:g('--hot'),link:g('--link'),linkHot:g('--link-hot'),field:g('--field'),
       ink:g('--ink'),ink2:g('--ink-2')};
}
readTheme();
const baseCol=i=>T[i]===0?COL.paper:T[i]===1?COL.kw:COL.au;

function fit(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false;
  for(let i=0;i<n;i++){ if(!show[i]) continue; any=true;
    if(X[i]<x0)x0=X[i]; if(X[i]>x1)x1=X[i]; if(Y[i]<y0)y0=Y[i]; if(Y[i]>y1)y1=Y[i]; }
  if(!any) return;
  const padL=w>880?320:20, padR=w>880?30:20, padY=w>880?40:150;
  const kk=Math.min((w-padL-padR)/(x1-x0+120),(h-padY*2)/(y1-y0+120));
  k=Math.max(0.08,Math.min(kk,3));
  tx=padL+(w-padL-padR)/2-((x0+x1)/2)*k; ty=h/2-((y0+y1)/2)*k;
}

let hover=-1, sel=-1, focusSet=null, querySet=null, fieldSel=-1;
const vis=i=>show[i];
function dimSet(){ return focusSet || querySet || (fieldSel>=0?null:null); }

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=COL.ground; ctx.fillRect(0,0,w,h);
  ctx.setTransform(k*dpr,0,0,k*dpr,tx*dpr,ty*dpr);
  const pad=40/k, x0=(-tx)/k-pad, x1=(w-tx)/k+pad, y0=(-ty)/k-pad, y1=(h-ty)/k+pad;
  const onScreen=i=>X[i]>=x0&&X[i]<=x1&&Y[i]>=y0&&Y[i]<=y1;

  const dsel=focusSet||querySet;
  const bright=i=>{
    if(fieldSel>=0 && COMM[i]!==fieldSel) return false;
    if(dsel) return dsel.has(i);
    return true;
  };
  const dim = !!dsel || fieldSel>=0;

  /* 갈래 이름 — 지도의 지역 이름처럼 노드 아래에 크게 */
  if(k<2.4){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let g=0;g<NF;g++){
      let sx=0,sy=0,c=0;
      for(let i=0;i<n;i++) if(COMM[i]===g&&show[i]&&T[i]===0){ sx+=X[i]; sy+=Y[i]; c++; }
      if(c<8) continue;
      const fs=Math.min(46/k,120);
      ctx.font=`700 ${fs}px "Gowun Batang",serif`;
      ctx.fillStyle=COL.field;
      ctx.globalAlpha = fieldSel>=0 ? (g===fieldSel?1:.25) : 1;
      ctx.fillText(FIELDS[g].name, sx/c, sy/c);
    }
    ctx.globalAlpha=1;
  }

  ctx.lineWidth=Math.min(1.1/k,1.6);
  ctx.strokeStyle=COL.link; ctx.beginPath();
  for(const [s,t] of L){
    if(!vis(s)||!vis(t)) continue;
    if(dsel&&(dsel.has(s)||dsel.has(t))) continue;
    ctx.moveTo(X[s],Y[s]); ctx.lineTo(X[t],Y[t]);
  }
  ctx.globalAlpha=dim?.3:1; ctx.stroke(); ctx.globalAlpha=1;

  if(dsel){
    ctx.strokeStyle=COL.linkHot; ctx.lineWidth=Math.min(1.5/k,2.2); ctx.beginPath();
    for(const [s,t] of L){
      if(!vis(s)||!vis(t)) continue;
      if(dsel.has(s)||dsel.has(t)){ ctx.moveTo(X[s],Y[s]); ctx.lineTo(X[t],Y[t]); }
    }
    ctx.stroke();
  }

  for(let i=0;i<n;i++){
    if(!vis(i)||!onScreen(i)) continue;
    const on=!dim||bright(i);
    ctx.globalAlpha=on?1:.14;
    const isSel=i===sel||i===hover;
    ctx.fillStyle=isSel?COL.hot:baseCol(i);
    ctx.beginPath(); ctx.arc(X[i],Y[i],R[i]*(i===sel?1.7:1),0,6.2832); ctx.fill();
    if(i===sel){
      ctx.globalAlpha=.85; ctx.strokeStyle=COL.hot; ctx.lineWidth=1.4/k;
      ctx.beginPath(); ctx.arc(X[i],Y[i],R[i]*1.7+6/k,0,6.2832); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  const thr = k>2.6?0 : k>1.5?3 : k>0.85?6 : 12;
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let i=0;i<n;i++){
    if(!vis(i)||T[i]===0||!onScreen(i)) continue;
    const strong = i===sel||i===hover||(dsel&&dsel.has(i));
    if(!strong && thr>0 && W[i]<thr) continue;
    if(dim && !bright(i)) continue;
    const fs=Math.min(Math.max(10/k,7),15/k);
    ctx.font=`400 ${fs}px "IBM Plex Sans KR",sans-serif`;
    ctx.fillStyle=strong?COL.ink:COL.ink2;
    ctx.fillText(N[i][1],X[i],Y[i]+R[i]+3/k);
  }
}

function loop(){
  if(cooling||alpha>0.0085) tick();
  if(!fitted && !cooling){ fit(); fitted=true; }
  draw();
  requestAnimationFrame(loop);
}
loop();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);

/* ── 조작 ── */
const toWorld=(px,py)=>[(px-tx)/k,(py-ty)/k];
function pick(px,py){
  const [wx,wy]=toWorld(px,py); let best=-1,bd=Infinity;
  for(let i=0;i<n;i++){
    if(!vis(i)) continue;
    const dx=X[i]-wx, dy=Y[i]-wy, d=dx*dx+dy*dy, rr=(R[i]+7/k)**2;
    if(d<rr&&d<bd){ bd=d; best=i; }
  }
  return best;
}
const tip=document.getElementById('tip');
const label=i=>T[i]===0?N[i][1]:`${N[i][1]} · ${N[i][3]}편`;
let drag=null, moved=false;

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); moved=false;
  const i=pick(e.offsetX,e.offsetY);
  if(i>=0){ drag={node:i}; fixed[i]=1; alpha=Math.max(alpha,.3); cooling=true; }
  else drag={pan:true,x:e.offsetX-tx,y:e.offsetY-ty};
  cv.classList.add('grabbing');
});
cv.addEventListener('pointermove',e=>{
  if(drag){
    moved=true;
    if(drag.pan){ tx=e.offsetX-drag.x; ty=e.offsetY-drag.y; }
    else{ const [wx,wy]=toWorld(e.offsetX,e.offsetY); X[drag.node]=wx; Y[drag.node]=wy; VX[drag.node]=VY[drag.node]=0; }
    return;
  }
  const i=pick(e.offsetX,e.offsetY);
  cv.classList.toggle('pointing',i>=0);
  if(i!==hover){
    hover=i;
    if(i>=0){ tip.textContent=label(i); tip.classList.add('on'); }
    else tip.classList.remove('on');
  }
  if(i>=0){
    const r=tip.getBoundingClientRect();
    tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-10)+'px';
    tip.style.top=Math.min(e.clientY+16,innerHeight-r.height-10)+'px';
  }
});
addEventListener('pointerup',()=>{
  cv.classList.remove('grabbing');
  if(drag&&!drag.pan){ fixed[drag.node]=0; if(!moved) select(drag.node); }
  drag=null;
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*(e.deltaMode===1?0.03:0.0016));
  const nk=Math.max(0.08,Math.min(9,k*f));
  tx=e.offsetX-(e.offsetX-tx)*(nk/k); ty=e.offsetY-(e.offsetY-ty)*(nk/k); k=nk;
},{passive:false});

/* ── 서지 카드 ── */
const card=document.getElementById('card'), kBody=document.getElementById('k-body'), kKind=document.getElementById('k-kind');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND=['논문','키워드','연구자'];
const kwIndex=new Map(), auIndex=new Map();
for(let i=NP;i<n;i++) (T[i]===1?kwIndex:auIndex).set(N[i][1],i);

function select(i){
  sel=i; focusSet=new Set([i,...adj[i]]);
  kKind.textContent=KIND[T[i]]; kKind.dataset.t=T[i];
  kBody.innerHTML=T[i]===0?paperHTML(i):groupHTML(i);
  card.classList.add('open'); kBody.scrollTop=0;
  kBody.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ const j=+b.dataset.go; select(j); center(j); });
}
function paperHTML(i){
  const m=META[i], nd=N[i];
  const issue=m[2]?`제${m[2]}권 ${m[3]||1}호`:'—';
  const pages=m[4]?`${m[4]}–${m[5]}`:'—';
  const kw=m[6].map(t=>{const j=kwIndex.get(t); return j==null?`<span class="chip" style="cursor:default">${esc(t)}</span>`:`<button class="chip" data-go="${j}">${esc(t)}</button>`;}).join('');
  const au=m[0].map(a=>{const j=auIndex.get(a); return j==null?`<span class="chip" style="cursor:default">${esc(a)}</span>`:`<button class="chip" data-go="${j}">${esc(a)}</button>`;}).join('');
  return `<h2>${esc(nd[1])}</h2>
    <dl>
      <dt>저자</dt><dd><div class="chips">${au}</div></dd>
      ${m[1]?`<dt>소속</dt><dd>${esc(m[1])}</dd>`:''}
      <dt>수록</dt><dd class="mono">복식 ${issue} · ${nd[2]}</dd>
      <dt>면수</dt><dd class="mono">${pages}</dd>
      <dt>피인용</dt><dd class="mono">${nd[3]}회</dd>
      <dt>갈래</dt><dd>${esc(FIELDS[COMM[i]].name)}</dd>
    </dl>
    ${m[6].length?`<p class="sub">키워드</p><div class="chips">${kw}</div>`:''}`;
}
function groupHTML(i){
  const ps=adj[i].filter(j=>T[j]===0).sort((a,b)=>N[b][2]-N[a][2]);
  const rows=ps.map(j=>`<button data-go="${j}"><span class="yr">${N[j][2]}</span>${esc(N[j][1])}</button>`).join('');
  return `<h2>${esc(N[i][1])}</h2>
    <dl><dt>논문 수</dt><dd class="mono">${ps.length}편</dd>
    <dt>기간</dt><dd class="mono">${ps.length?`${N[ps[ps.length-1]][2]}–${N[ps[0]][2]}`:'—'}</dd>
    <dt>갈래</dt><dd>${esc(FIELDS[COMM[i]].name)}</dd></dl>
    <p class="sub">관련 논문</p><div class="list">${rows}</div>`;
}
function center(i){ const k2=Math.max(k,1.9); tx=w/2-X[i]*k2; ty=h/2-Y[i]*k2; k=k2; }
function closeCard(){ card.classList.remove('open'); sel=-1; focusSet=null; }
document.getElementById('k-x').onclick=closeCard;

/* ── 검색 ── */
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){ querySet=null; return; }
  const s=new Set();
  for(let i=0;i<n;i++) if(N[i][1].toLowerCase().includes(v)) s.add(i);
  for(const i of [...s]) for(const j of adj[i]) s.add(j);
  querySet=s;
});

/* ── 필터 ── */
const on=[true,true,true];
let yLo=0,yHi=0;
function applyFilters(){
  for(let i=0;i<n;i++){
    if(T[i]===0) show[i]=on[0]&&N[i][2]>=yLo&&N[i][2]<=yHi ?1:0;
    else show[i]=on[T[i]]?1:0;
  }
  for(let i=NP;i<n;i++) if(show[i]&&!adj[i].some(j=>show[j])) show[i]=0;
}
[0,1,2].forEach(t=>{
  const b=document.getElementById('f'+t);
  document.getElementById('c'+t).textContent=N.filter(d=>d[0]===t).length.toLocaleString('ko');
  b.onclick=()=>{ on[t]=!on[t]; b.setAttribute('aria-pressed',on[t]); applyFilters(); };
});

const fieldList=document.getElementById('fieldList');
FIELDS.forEach((f,gi)=>{
  const b=document.createElement('button');
  b.setAttribute('aria-pressed','false');
  b.innerHTML=`${esc(f.name)}<span class="num">${f.papers}</span>`;
  b.onclick=()=>{
    fieldSel = fieldSel===gi ? -1 : gi;
    [...fieldList.children].forEach((c,ci)=>c.setAttribute('aria-pressed', ci===fieldSel));
  };
  fieldList.appendChild(b);
});

const ya=document.getElementById('ya'), yb=document.getElementById('yb');
let minY=9999,maxY=0;
for(let i=0;i<NP;i++){ if(N[i][2]<minY)minY=N[i][2]; if(N[i][2]>maxY)maxY=N[i][2]; }
yLo=minY; yHi=maxY;
[ya,yb].forEach(s=>{ s.min=minY; s.max=maxY; s.step=1; });
ya.value=minY; yb.value=maxY;
function syncYears(){
  yLo=Math.min(+ya.value,+yb.value); yHi=Math.max(+ya.value,+yb.value);
  document.getElementById('y-lo').textContent=yLo;
  document.getElementById('y-hi').textContent=yHi;
  applyFilters();
}
ya.oninput=yb.oninput=syncYears; syncYears();

document.getElementById('t-p').textContent=NP.toLocaleString('ko');
document.getElementById('t-k').textContent=kwIndex.size.toLocaleString('ko');
document.getElementById('t-a').textContent=auIndex.size.toLocaleString('ko');
document.getElementById('t-y').textContent=`${minY}–${String(maxY).slice(2)}`;

document.getElementById('fit').onclick=()=>fit();
document.getElementById('theme').onclick=()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=cur==='dark'?'light':'dark';
  readTheme();
};

/* ── 대문 열기 ── */
const gate=document.getElementById('gate');
document.getElementById('gateStat').textContent =
  `논문 ${NP.toLocaleString('ko')}편 · 키워드 ${kwIndex.size.toLocaleString('ko')}개 · 연구자 ${auIndex.size.toLocaleString('ko')}명`;
document.getElementById('enter').onclick=()=>{
  gate.classList.add('open');
  setTimeout(()=>{ gate.style.display='none'; fit(); }, 1500);
};

addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeCard(); querySet=null; q.value=''; q.blur(); } });
</script>
